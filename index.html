<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danny's Wok | Choose Your Store</title>
  <link rel="icon" type="image/png" href="images/favi.png">
  <meta property="og:image" content="images/link_image.png">
  <meta name="twitter:image" content="images/link_image.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <img src="images/logos6.png" alt="Danny's Wok logo" class="loading-logo">
  </div>
  <header class="landing-header">
    <a href="index.html" class="site-logo" aria-label="Danny's Wok landing page">
      <img src="images/logos_icon.png" alt="Danny's Wok chef mascot" class="site-logo__icon">
      <img src="images/logos_font.png" alt="Danny's Wok wordmark" class="site-logo__wordmark">
    </a>
  </header>
  <main class="landing-main" aria-labelledby="store-selection-title">
    <section class="store-selector" id="store-selector">
      <div class="store-selector__intro">
        <h1 id="store-selection-title">Pick your Danny's Wok</h1>
        <p>Choose the location nearest to you, watch the map zoom in, then continue to the menu.</p>
      </div>
      <div class="store-layout">
        <div class="store-list" role="list" id="store-list"></div>
        <div class="store-map-wrapper" aria-hidden="false">
          <div id="store-map" class="store-map" role="presentation" aria-label="Map showing Danny's Wok locations"></div>
        </div>
      </div>
      <a href="menu.html" id="enter-menu-link" class="enter-menu-link is-disabled" aria-disabled="true" tabindex="-1">Continue to the menu</a>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="analytics-client.js"></script>
  <script src="landing.js"></script>
</body>
</html>
