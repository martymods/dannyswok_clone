<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danny's Wok Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="#our_menu" class="site-logo" aria-label="Danny's Wok home">
      <img src="images/logos_icon.png" alt="Danny's Wok chef mascot" class="site-logo__icon">
      <img src="images/logos_font.png" alt="Danny's Wok wordmark" class="site-logo__wordmark">
    </a>
    <nav>
      <a href="#our_menu">Menu</a>
      <a href="#cart" class="cart-link">Cart <span id="cart-count" class="cart-count">0</span></a>
    </nav>
  </header>
  <section class="hero" aria-label="Browse the Danny's Wok menu">
    <div class="hero-heading">
      <h1>Slide through the menu</h1>
      <p>Tap any dish to add it to your cart instantly.</p>
    </div>
    <div class="hero-carousel" id="hero-carousel">
      <div class="hero-track" id="hero-track" aria-hidden="false"></div>
    </div>
  </section>
  <main>
    <section id="our_menu" class="pt-5 pb-5">
      <div class="container">
        <div class="row">
          <div class="col-lg-12">
            <div class="page_title text-center mb-4">
              <h1>our menu</h1>
              <div class="single_line"></div>
            </div>
          </div>
        </div>
        <div class="row">
          <ul class="nav nav-tabs menu_tab mb-4" id="menuTab" role="tablist">
            <!-- Tabs will be injected here -->
          </ul>
        </div>
        <div class="row">
          <div class="tab-content col-lg-12" id="menuTabContent">
            <!-- Tab panes will be injected here -->
          </div>
          <a href="#our_menu" class="menu_btn btn btn-danger">view more</a>
        </div>
      </div>
    </section>
    <section id="cart">
      <h2>Your Cart</h2>
      <div class="cart-summary">
        <p id="cart-empty" class="cart-empty">Your cart is currently empty.</p>
        <ul id="cart-items" class="cart-items"></ul>
        <div class="cart-footer">
          <div id="cart-total" class="cart-total">Total: $0.00</div>
          <button id="checkout-button" class="checkout-btn" disabled>Check out</button>
        </div>
      </div>
      <div id="checkout-panel" class="checkout-panel hidden" aria-hidden="true">
        <div class="checkout-header">
          <h3>Review &amp; confirm</h3>
          <button id="close-checkout" class="close-checkout" aria-label="Close checkout">×</button>
        </div>
        <fieldset class="fulfilment-options">
          <legend>How would you like to get your order?</legend>
          <label>
            <input type="radio" name="fulfilment" value="pickup" id="fulfilment-pickup" checked>
            Pickup (default)
          </label>
          <label>
            <input type="radio" name="fulfilment" value="delivery" id="fulfilment-delivery">
            Delivery
          </label>
        </fieldset>
        <div id="delivery-fields" class="delivery-fields hidden">
          <div class="field">
            <label for="delivery-name">Name</label>
            <input type="text" id="delivery-name" name="delivery-name" autocomplete="name" placeholder="Full name">
          </div>
          <div class="field">
            <label for="delivery-phone">Phone number</label>
            <input type="tel" id="delivery-phone" name="delivery-phone" autocomplete="tel" placeholder="(555) 555-5555">
          </div>
          <div class="field">
            <label for="delivery-address">Address</label>
            <input type="text" id="delivery-address" name="delivery-address" autocomplete="street-address" placeholder="Street address">
          </div>
          <div class="field half">
            <div>
              <label for="delivery-city">City</label>
              <input type="text" id="delivery-city" name="delivery-city" autocomplete="address-level2" placeholder="City">
            </div>
            <div>
              <label for="delivery-zip">ZIP</label>
              <input type="text" id="delivery-zip" name="delivery-zip" autocomplete="postal-code" placeholder="ZIP code">
            </div>
          </div>
        </div>
        <div id="checkout-items" class="checkout-items"></div>
        <div class="checkout-total-row">
          <span>Total</span>
          <strong id="checkout-total-amount">$0.00</strong>
        </div>
        <button id="place-order" class="place-order-btn">Place order</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
