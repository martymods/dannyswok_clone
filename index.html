<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danny's Wok | Choose Your Store</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="landing-page">
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <img src="images/logos6.png" alt="Danny's Wok logo" class="loading-logo">
  </div>
  <header class="landing-header">
    <a href="index.html" class="site-logo" aria-label="Danny's Wok landing page">
      <img src="images/logos_icon.png" alt="Danny's Wok chef mascot" class="site-logo__icon">
      <img src="images/logos_font.png" alt="Danny's Wok wordmark" class="site-logo__wordmark">
    </a>
  </header>
  <main class="landing-main" aria-labelledby="store-selection-title">
    <section class="store-selector" id="store-selector">
      <div class="store-selector__intro">
        <h1 id="store-selection-title">Pick your Danny's Wok</h1>
        <p>Choose the location nearest to you, watch the map zoom in, then continue to the menu.</p>
      </div>
      <div class="store-layout">
        <div class="store-list" role="list">
          <button type="button" class="store-card" role="listitem" data-id="southwest" data-label="Southwest" data-lat="39.943818" data-lng="-75.239562">
            <h2>5750 BALTIMORE AVE, PHILADELPHIA PA 19143</h2>
            <p class="store-card__tag">(Southwest)</p>
            <p class="store-card__phone">Phone: <span>215-471-9020</span></p>
            <span class="store-card__cta">Enter &raquo;&raquo;</span>
          </button>
          <button type="button" class="store-card" role="listitem" data-id="olney" data-label="One &amp; Olney Plaza" data-lat="40.039947" data-lng="-75.122995">
            <h2>5675 N Front St Unit 280, PHILADELPHIA, PA, 19120</h2>
            <p class="store-card__tag">(One &amp; Olney Plaza)</p>
            <p class="store-card__phone">Phone: <span>215-276-8885</span></p>
            <span class="store-card__cta">Enter &raquo;&raquo;</span>
          </button>
          <button type="button" class="store-card" role="listitem" data-id="hunting-park" data-label="Hunting Park" data-lat="40.016985" data-lng="-75.145408">
            <h2>4322 North Broad Street, Philadelphia, PA 19140</h2>
            <p class="store-card__tag">(Hunting Park)</p>
            <p class="store-card__phone">Phone: <span>267-331-6699</span></p>
            <span class="store-card__cta">Enter &raquo;&raquo;</span>
          </button>
        </div>
        <div class="store-map-wrapper" aria-hidden="false">
          <div id="store-map" class="store-map" role="presentation" aria-label="Map showing Danny's Wok locations"></div>
        </div>
      </div>
      <a href="menu.html" id="enter-menu-link" class="enter-menu-link is-disabled" aria-disabled="true" tabindex="-1">Continue to the menu</a>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="landing.js"></script>
</body>
</html>
